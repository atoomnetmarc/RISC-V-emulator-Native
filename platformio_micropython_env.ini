; MicroPython build envs. The ISA sets mirror the port's min/max firmware.
; Kept separate so Sv32 and the Linux ISA set stay out of these targets.

[micropython-min]
build_flags       =
  -D RVE_E_ZICSR=1

[micropython-max]
extends           = micropython-min
build_flags       =
  ${micropython-min.build_flags}
  -D RVE_E_M=1
  -D RVE_E_C=1
  -D RVE_E_ZBA=1
  -D RVE_E_ZBB=1
  -D RVE_E_ZBKB=1
  -D RVE_E_ZBKC=1
  -D RVE_E_ZBKX=1
  -D RVE_E_ZBS=1
  -D RVE_E_ZCB=1
  -D RVE_E_ZCMOP=1
  -D RVE_E_ZICOND=1
  -D RVE_E_ZIHINTNTL=1
  -D RVE_E_ZIHINTPAUSE=1
  -D RVE_E_ZIMOP=1

[env:RV32I-micropython-min]
extends           = common
build_flags       =
  ${common.build_flags}
  ${micropython-min.build_flags}
  -URVE_E_DISASM

[env:RV32I-micropython-max]
extends           = common
build_flags       =
  ${common.build_flags}
  ${micropython-max.build_flags}
  -URVE_E_DISASM
