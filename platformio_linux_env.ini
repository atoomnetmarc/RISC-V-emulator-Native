; Static Linux envs for the rv32i-linux images.
; Not generated; edit by hand.

; Shared optimization and linker flags for all Linux images.
[linux-base]
build_flags       =
  -Os
  -g0
  -flto
  -ffunction-sections
  -fdata-sections
  -fno-asynchronous-unwind-tables
  -fno-unwind-tables
  -fno-ident
  -fno-stack-protector
  -Wl,--gc-sections
  -Wl,--build-id=none
  -Wl,-z,noseparate-code
  -Wl,--no-eh-frame-hdr
  -Wl,-s
  -D RVE_E_MISALIGNED=1

; Minimal ISA set.
[linux-min]
extends           = linux-base
build_flags       =
  ${linux-base.build_flags}
  -D RVE_E_M=1
  -D RVE_E_A=1
  -D RVE_E_ZICSR=1
  -D RVE_E_ZIFENCEI=1

; Maximal ISA set: everything in linux-min plus the remaining extensions.
[linux-max]
extends           = linux-min
build_flags       =
  ${linux-min.build_flags}
  -D RVE_E_C=1
  -D RVE_E_ZBA=1
  -D RVE_E_ZBB=1
  -D RVE_E_ZBKB=1
  -D RVE_E_ZBKC=1
  -D RVE_E_ZBKX=1
  -D RVE_E_ZBS=1
  -D RVE_E_ZCB=1
  -D RVE_E_ZCMOP=1
  -D RVE_E_ZICNTR=1
  -D RVE_E_ZICOND=1
  -D RVE_E_ZIHINTNTL=1
  -D RVE_E_ZIHINTPAUSE=1
  -D RVE_E_ZIMOP=1

[env:RV32I-linux-min]
extends           = common
build_flags       =
  ${common.build_flags}
  ${linux-min.build_flags}
  -URVE_E_DISASM

[env:RV32I-linux-min-disasm]
extends           = common
build_flags       =
  ${common.build_flags}
  ${linux-min.build_flags}

[env:RV32I-linux-max]
extends           = common
build_flags       =
  ${common.build_flags}
  ${linux-max.build_flags}
  -URVE_E_DISASM

[env:RV32I-linux-max-disasm]
extends           = common
build_flags       =
  ${common.build_flags}
  ${linux-max.build_flags}
